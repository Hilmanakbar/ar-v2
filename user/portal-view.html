<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal View — AR Portal</title>

  <!-- model-viewer Web Component (Sketchfab-like 3D + AR) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #6366f1;
      --primary-dark:  #4f46e5;
      --primary-light: #818cf8;
      --secondary:     #10b981;
      --danger:        #ef4444;
      --bg:            #0f0f1a;
      --bg-card:       #1a1a2e;
      --bg-elevated:   #1e2642;
      --text:          #e2e8f0;
      --text-muted:    #94a3b8;
      --text-dim:      #64748b;
      --border:        #2d2d4e;
      --navbar-h:      56px;
      --sidebar-w:     280px;
      --desc-h:        140px;
      --radius:        12px;
      --transition:    0.25s ease;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    /* ---- Full-screen viewer shell ---- */
    #viewer-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ---- model-viewer fills everything ---- */
    #main-viewer {
      flex: 1;
      width: 100%;
      background: var(--bg);
      --poster-color: #0f0f1a;
    }

    /* ---- Top Navbar overlay ---- */
    #top-navbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--navbar-h);
      background: rgba(15, 15, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    .nav-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: background var(--transition);
    }
    .nav-back:hover { background: rgba(255,255,255,0.12); }
    .nav-portal-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      flex: 1;
      padding: 0 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-actions {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
    }
    .nav-btn:hover { background: rgba(255,255,255,0.14); }
    .nav-btn-primary {
      background: rgba(99,102,241,0.3);
      border-color: rgba(99,102,241,0.5);
    }
    .nav-btn-primary:hover { background: rgba(99,102,241,0.5); }

    /* ---- Right Sidebar (model list) ---- */
    #sidebar {
      position: absolute;
      top: var(--navbar-h);
      right: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: rgba(15, 15, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      z-index: 90;
      transform: translateX(0);
      transition: transform var(--transition);
      overflow: hidden;
    }
    #sidebar.sidebar-hidden {
      transform: translateX(100%);
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .sidebar-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color var(--transition), background var(--transition);
    }
    .sidebar-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .model-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      user-select: none;
    }
    .model-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.08);
    }
    .model-item.active {
      background: rgba(99,102,241,0.15);
      border-color: rgba(99,102,241,0.4);
    }
    .model-item-icon { font-size: 1.3rem; flex-shrink: 0; }
    .model-item-info { flex: 1; min-width: 0; }
    .model-item-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-item-format {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .model-item-active-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-light);
      flex-shrink: 0;
      display: none;
    }
    .model-item.active .model-item-active-dot { display: block; }

    /* ---- Bottom Description Panel ---- */
    #desc-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: var(--sidebar-w);
      background: rgba(15, 15, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 16px 20px;
      z-index: 90;
      transform: translateY(100%);
      transition: transform var(--transition);
    }
    #desc-panel.panel-visible {
      transform: translateY(0);
    }
    #desc-panel.sidebar-hidden-offset {
      right: 0;
    }
    .desc-panel-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .desc-panel-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .desc-panel-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* ---- Loading Overlay ---- */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 26, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
      transition: opacity 0.4s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(99,102,241,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-label { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }

    /* ---- Error / Not found state ---- */
    #error-state {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 150;
      text-align: center;
      padding: 20px;
    }
    #error-state.show { display: flex; }
    .error-icon { font-size: 4rem; }
    .error-title { font-size: 1.5rem; font-weight: 700; }
    .error-msg { color: var(--text-muted); max-width: 400px; }

    /* ---- Empty models state ---- */
    #empty-models {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px;
      z-index: 50;
    }
    .empty-models-icon { font-size: 3rem; margin-bottom: 10px; }
    .empty-models-text { color: var(--text-muted); font-size: 0.9rem; }

    /* ---- Sidebar toggle button (mobile) ---- */
    #toggle-sidebar-btn {
      position: absolute;
      top: calc(var(--navbar-h) + 12px);
      right: 12px;
      z-index: 95;
      background: rgba(15,15,26,0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      display: none; /* shown via JS on mobile / when sidebar hidden */
      gap: 6px;
      align-items: center;
      transition: background var(--transition);
    }
    #toggle-sidebar-btn:hover { background: rgba(99,102,241,0.3); }

    /* ---- Responsive: on small screens sidebar is overlay ---- */
    @media (max-width: 640px) {
      :root { --sidebar-w: 100%; }
      #sidebar {
        top: var(--navbar-h);
        bottom: 0;
        width: 90%;
        left: auto;
        right: 0;
        border-left: 1px solid rgba(255,255,255,0.1);
        box-shadow: -4px 0 24px rgba(0,0,0,0.5);
      }
      #desc-panel { right: 0; }
      #toggle-sidebar-btn { display: flex; }
    }
    @media (min-width: 641px) {
      #toggle-sidebar-btn { display: flex; }
    }

    /* ---- Badges ---- */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-success { background: rgba(16,185,129,0.2); color: #34d399; }
    .badge-info    { background: rgba(59,130,246,0.2);  color: #60a5fa; }
    .badge-warning { background: rgba(245,158,11,0.2);  color: #fbbf24; }
    .badge-primary { background: rgba(99,102,241,0.2);  color: #818cf8; }

    /* model-viewer AR button custom style */
    model-viewer::part(default-ar-button) {
      bottom: 100px;
      right: 16px;
      background: rgba(99,102,241,0.9);
      border-radius: 12px;
      padding: 10px 16px;
    }
  </style>
</head>
<body>

  <!-- Full-screen viewer shell -->
  <div id="viewer-shell">

    <!-- Loading overlay -->
    <div id="loading-overlay">
      <div class="loader-spinner"></div>
      <div class="loader-label" id="loader-label">Memuat portal...</div>
    </div>

    <!-- Error state -->
    <div id="error-state">
      <div class="error-icon">⚠️</div>
      <div class="error-title">Portal tidak ditemukan</div>
      <div class="error-msg" id="error-msg">Portal yang Anda cari tidak tersedia. Pastikan link benar atau hubungi admin.</div>
      <a href="index.html" style="margin-top:8px;padding:10px 20px;background:var(--primary);color:#fff;border-radius:var(--radius);font-weight:600;text-decoration:none;">← Kembali ke daftar portal</a>
    </div>

    <!-- The main model-viewer -->
    <model-viewer
      id="main-viewer"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      shadow-intensity="1"
      environment-image="neutral"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      loading="eager"
      reveal="auto"
      style="width:100%;height:100%;background:var(--bg);"
    ></model-viewer>

    <!-- Empty models state -->
    <div id="empty-models">
      <div class="empty-models-icon">🗂️</div>
      <div class="empty-models-text">Portal ini belum memiliki model 3D.</div>
    </div>

    <!-- Top Navbar overlay -->
    <div id="top-navbar">
      <a href="index.html" class="nav-back">← Portal</a>
      <div class="nav-portal-name" id="portal-title">Memuat...</div>
      <div class="nav-actions">
        <button class="nav-btn nav-btn-primary" id="ar-hint-btn" title="Lihat dalam AR">📱 AR</button>
      </div>
    </div>

    <!-- Sidebar toggle button -->
    <button id="toggle-sidebar-btn" onclick="toggleSidebar()">
      <span id="toggle-icon">◀</span> <span id="toggle-label">Model</span>
    </button>

    <!-- Right sidebar: model list -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">🗂️ Daftar Model</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Bottom description panel -->
    <div id="desc-panel">
      <div class="desc-panel-name" id="desc-name">—</div>
      <div class="desc-panel-text" id="desc-text">—</div>
      <div class="desc-panel-meta" id="desc-meta"></div>
    </div>

  </div><!-- /viewer-shell -->

  <script>
    // ============================================================
    // 1. Read portal ID from URL
    // ============================================================
    const params   = new URLSearchParams(location.search);
    const portalId = params.get('id');

    const viewer        = document.getElementById('main-viewer');
    const loadingOvl    = document.getElementById('loading-overlay');
    const loaderLabel   = document.getElementById('loader-label');
    const errorState    = document.getElementById('error-state');
    const errorMsg      = document.getElementById('error-msg');
    const emptyModels   = document.getElementById('empty-models');
    const sidebarEl     = document.getElementById('sidebar');
    const sidebarList   = document.getElementById('sidebar-list');
    const descPanel     = document.getElementById('desc-panel');
    const descName      = document.getElementById('desc-name');
    const descText      = document.getElementById('desc-text');
    const descMeta      = document.getElementById('desc-meta');
    const portalTitle   = document.getElementById('portal-title');
    const toggleBtn     = document.getElementById('toggle-sidebar-btn');
    const toggleIcon    = document.getElementById('toggle-icon');
    const toggleLabel   = document.getElementById('toggle-label');

    let portalModels = [];
    let currentModelIdx = -1;
    let sidebarOpen = true;

    // ============================================================
    // 2. Load portals.json (static file on Netlify / local dev)
    // ============================================================
    async function loadPortalsData() {
      // Try relative /data/portals.json first (works on Netlify)
      try {
        const res = await fetch('/data/portals.json?t=' + Date.now());
        if (res.ok) return res.json();
      } catch {}

      // Fallback: try same-directory relative path
      try {
        const res = await fetch('../data/portals.json?t=' + Date.now());
        if (res.ok) return res.json();
      } catch {}

      throw new Error('Cannot load portals.json');
    }

    // ============================================================
    // 3. Main init
    // ============================================================
    async function init() {
      if (!portalId) {
        showError('URL tidak valid. Parameter ?id= diperlukan.');
        return;
      }

      try {
        setLoader('Memuat data portal...');
        const data = await loadPortalsData();
        const portal = (data.portals || []).find(p => p.id === portalId);

        if (!portal) {
          showError('Portal dengan ID "' + portalId + '" tidak ditemukan.');
          return;
        }

        // Set portal name
        portalTitle.textContent = portal.name;
        document.title = portal.name + ' — AR Portal';

        // Find models for this portal
        const allModels = data.models || [];
        portalModels = (portal.modelIds || [])
          .map(id => allModels.find(m => m.id === id))
          .filter(Boolean);

        if (portalModels.length === 0) {
          hideLoader();
          emptyModels.style.display = '';
          return;
        }

        // Build sidebar list
        buildSidebar();

        // Load first model
        await selectModel(0);

      } catch (err) {
        showError('Gagal memuat portal: ' + err.message);
      }
    }

    // ============================================================
    // 4. Build sidebar model list
    // ============================================================
    function buildSidebar() {
      sidebarList.innerHTML = portalModels.map((m, i) => `
        <div class="model-item" id="model-item-${i}" onclick="selectModel(${i})">
          <span class="model-item-icon">${getModelIcon(m.format)}</span>
          <div class="model-item-info">
            <div class="model-item-name">${m.name}</div>
            <div class="model-item-format">${formatBadge(m.format)}</div>
          </div>
          <div class="model-item-active-dot"></div>
        </div>`).join('');
    }

    // ============================================================
    // 5. Select and load a model in model-viewer
    // ============================================================
    async function selectModel(idx) {
      if (idx < 0 || idx >= portalModels.length) return;
      const model = portalModels[idx];
      currentModelIdx = idx;

      // Update active state in sidebar
      document.querySelectorAll('.model-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      // Show description panel
      descName.textContent = model.name;
      descText.textContent = model.description || 'Model 3D interaktif. Gunakan gesture untuk memutar dan zoom.';
      descMeta.innerHTML = `
        ${formatBadge(model.format)}
        <span style="color:var(--text-dim);font-size:0.78rem;">${model.filename || ''}</span>`;
      descPanel.classList.add('panel-visible');

      // Load model in viewer
      setLoader('Memuat model: ' + model.name + '...');
      viewer.style.opacity = '0';
      viewer.style.transition = 'opacity 0.3s ease';

      try {
        viewer.setAttribute('src', model.url);
        viewer.setAttribute('alt', model.name);

        // Wait for model to load
        await new Promise((resolve, reject) => {
          const onLoad = () => { viewer.removeEventListener('load', onLoad); viewer.removeEventListener('error', onErr); resolve(); };
          const onErr  = (e) => { viewer.removeEventListener('load', onLoad); viewer.removeEventListener('error', onErr); reject(new Error('Model load error')); };
          viewer.addEventListener('load', onLoad);
          viewer.addEventListener('error', onErr);
          // Fallback timeout — if load doesn't fire in 15s, resolve anyway
          setTimeout(resolve, 15000);
        });
      } catch (err) {
        console.warn('Model load warning:', err.message);
      }

      hideLoader();
      viewer.style.opacity = '1';
    }

    // ============================================================
    // 6. Sidebar toggle
    // ============================================================
    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      sidebarEl.classList.toggle('sidebar-hidden', !sidebarOpen);
      descPanel.classList.toggle('sidebar-hidden-offset', !sidebarOpen);

      if (sidebarOpen) {
        toggleIcon.textContent = '▶';
        toggleLabel.textContent = 'Tutup';
        toggleBtn.style.right = 'calc(var(--sidebar-w) + 12px)';
      } else {
        toggleIcon.textContent = '◀';
        toggleLabel.textContent = 'Model';
        toggleBtn.style.right = '12px';
      }
    }

    // ============================================================
    // 7. AR button handler (Dual-Engine: Native ARCore or Universal WebAR)
    // ============================================================
    document.getElementById('ar-hint-btn').addEventListener('click', async () => {
      // If model-viewer supports native AR, try it first
      if (viewer && viewer.canActivateAR) {
        try {
          await viewer.activateAR();
          return;
        } catch (err) {
          console.warn('Native AR activation failed, switching to Universal AR Portal:', err);
        }
      }

      // If native AR is unsupported (general specification phones), redirect to Universal WebAR Portal
      window.location.href = '../ar-portal.html';
    });

    // ============================================================
    // 8. Auto-rotate: pause when user interacts
    // ============================================================
    viewer.addEventListener('camera-change', () => {
      // Keep auto-rotate off during interaction
    });

    // ============================================================
    // Helpers
    // ============================================================
    function setLoader(msg) {
      loaderLabel.textContent = msg;
      loadingOvl.classList.remove('hidden');
    }

    function hideLoader() {
      loadingOvl.classList.add('hidden');
    }

    function showError(msg) {
      hideLoader();
      errorMsg.textContent = msg;
      errorState.classList.add('show');
    }

    function getModelIcon(format) {
      const icons = { glb: '🗂️', gltf: '🗂️', obj: '📐', stl: '🖨️', dae: '🎨' };
      return icons[(format || '').toLowerCase()] || '🗂️';
    }

    function formatBadge(format) {
      const colorMap = { gltf: 'badge-success', glb: 'badge-success', obj: 'badge-info', stl: 'badge-warning', dae: 'badge-primary' };
      const cls = colorMap[(format || '').toLowerCase()] || 'badge-info';
      return `<span class="badge ${cls}">${(format || '?').toUpperCase()}</span>`;
    }

    // ============================================================
    // 9. Init on sidebar state for desktop
    // ============================================================
    function initSidebarState() {
      // On desktop start open, mobile start closed
      if (window.innerWidth <= 640) {
        sidebarOpen = false;
        sidebarEl.classList.add('sidebar-hidden');
        descPanel.classList.add('sidebar-hidden-offset');
        toggleIcon.textContent = '◀';
        toggleLabel.textContent = 'Model';
        toggleBtn.style.right = '12px';
      } else {
        sidebarOpen = true;
        toggleIcon.textContent = '▶';
        toggleLabel.textContent = 'Tutup';
        toggleBtn.style.right = 'calc(var(--sidebar-w) + 12px)';
      }
    }

    // ============================================================
    // 10. Keyboard shortcuts
    // ============================================================
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (currentModelIdx < portalModels.length - 1) selectModel(currentModelIdx + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (currentModelIdx > 0) selectModel(currentModelIdx - 1);
      } else if (e.key === 's' || e.key === 'S') {
        toggleSidebar();
      }
    });

    // ============================================================
    // Start!
    // ============================================================
    initSidebarState();
    init();
  </script>
</body>
</html>
