<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal AR — Jelajahi</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .portal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: border-color var(--transition), transform var(--transition-slow), box-shadow var(--transition);
      display: flex;
      flex-direction: column;
    }
    .portal-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(99,102,241,0.2);
    }
    .portal-card-thumb {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      position: relative;
      overflow: hidden;
    }
    .portal-card-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(99,102,241,0.15) 0%, transparent 70%);
    }
    .portal-model-count {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-full);
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .portal-card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .portal-card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .portal-card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      flex: 1;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .portal-card-footer {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .portal-model-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    /* Hero section */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .hero-logo { font-size: 4rem; margin-bottom: 16px; }
    .hero-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.02em; }
    .hero-subtitle { color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto 32px; }
    .hero-gradient { background: linear-gradient(135deg, var(--primary-light), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-surface) 50%, var(--bg-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto 32px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <span class="nav-brand-icon">🌀</span>
      AR Portal
    </a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">🏠 Beranda</a>
    </div>
  </nav>

  <div class="page-container">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-logo">🌐</div>
      <h1 class="hero-title">Jelajahi <span class="hero-gradient">Portal AR</span></h1>
      <p class="hero-subtitle">Pilih portal untuk mengeksplorasi model 3D interaktif. Gunakan AR untuk menempatkan objek di dunia nyata.</p>

      <!-- Featured Quick Access -->
      <div style="margin-bottom: 24px;">
        <a href="../ar-plan-portal.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:linear-gradient(135deg, #06b6d4, #6366f1);color:#fff;border-radius:999px;font-weight:700;text-decoration:none;box-shadow:0 6px 20px rgba(6,182,212,0.4);">
          <span>📍</span>
          <span>Buka Langsung: AR Plan & Koordinat Flora</span>
          <span>→</span>
        </a>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 Cari portal..." />
      </div>
    </div>

    <!-- Portal Grid -->
    <div class="page-content" style="padding-top:0;">
      <div id="portal-container">
        <!-- Skeleton loaders -->
        <div class="portal-grid" id="skeleton-grid">
          ${[1,2,3].map(() => `
            <div class="skeleton-card">
              <div class="skeleton" style="height:160px;border-radius:0;"></div>
              <div style="padding:20px;">
                <div class="skeleton" style="height:20px;width:60%;margin-bottom:12px;"></div>
                <div class="skeleton" style="height:14px;width:90%;margin-bottom:6px;"></div>
                <div class="skeleton" style="height:14px;width:70%;margin-bottom:20px;"></div>
                <div class="skeleton" style="height:36px;width:120px;border-radius:var(--radius);"></div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>

  </div>

  <script src="../js/app.js"></script>
  <script src="../js/github-storage.js"></script>
  <script>
    let allPortals = [];
    let allModels  = [];

    async function loadPortals() {
      try {
        // Load from /data/portals.json (works on Netlify — file is in repo)
        // Also works locally if dev server is running
        const res = await fetch('/data/portals.json?t=' + Date.now());
        if (!res.ok) throw new Error('portals.json not found');
        const data = await res.json();
        allPortals = data.portals || [];
        allModels  = data.models  || [];
      } catch {
        // Fallback: try GitHubStorage if configured
        try {
          allPortals = await GitHubStorage.getAllPortals();
          allModels  = await GitHubStorage.getAllModels();
        } catch {
          allPortals = [];
          allModels  = [];
        }
      }

      renderPortals(allPortals);
    }

    function renderPortals(portals) {
      const container = document.getElementById('portal-container');

      if (portals.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🌐</div>
            <div class="empty-title">Belum ada portal</div>
            <div class="empty-description">Admin belum membuat portal. Kunjungi kembali nanti.</div>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="portal-grid">
          ${portals.map(p => {
            const models = (p.modelIds || []).map(id => allModels.find(m => m.id === id)).filter(Boolean);
            const formats = [...new Set(models.map(m => m.format))];
            return `
              <div class="portal-card">
                <div class="portal-card-thumb">
                  <span>🌐</span>
                  <span class="portal-model-count">${models.length} model</span>
                </div>
                <div class="portal-card-body">
                  <div class="portal-card-name">${p.name}</div>
                  <div class="portal-card-desc">${p.description || 'Jelajahi koleksi model 3D interaktif dalam portal ini.'}</div>
                  <div class="portal-card-footer">
                    <div class="portal-model-badges">
                      ${formats.map(f => AppUtils.getFormatBadge(f)).join('')}
                    </div>
                    <a href="portal-view.html?id=${p.id}" class="btn btn-primary btn-sm">🚀 Buka AR</a>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }

    // Search
    document.getElementById('search-input').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { renderPortals(allPortals); return; }
      renderPortals(allPortals.filter(p =>
        p.name.toLowerCase().includes(q) ||
        (p.description || '').toLowerCase().includes(q)
      ));
    });

    // Init
    loadPortals();
  </script>
</body>
</html>
